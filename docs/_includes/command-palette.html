<dialog class="command-palette" id="command-palette" aria-label="Search the site" data-search-index="{{ '/search.json' | relative_url }}">
  <div class="command-palette__topline">
    <input class="command-palette__input" id="command-palette-input" type="search" autocomplete="off" placeholder="Search posts, pages, and projects" aria-label="Search the site">
    <button class="command-palette__close" type="button" data-command-palette-close>Close</button>
  </div>
  <nav class="command-palette__list" aria-label="Search results" aria-live="polite" data-command-palette-results></nav>
</dialog>
